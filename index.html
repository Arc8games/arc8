<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arc8 is a free arcade in your browser: 40 games, new ones every day. No download, no sign-up.">
<meta name="theme-color" content="#08051a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arc8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<!-- Link previews (social, chat apps). IMPORTANT: replace YOUR-DOMAIN.com with your real address — crawlers need a full URL. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Arc8 — Free Arcade Games">
<meta property="og:description" content="40 arcade games in your browser. New games every day.">
<meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png">
<title>Arc8 — Free Arcade Games</title>
<style>
:root{
  --bg:#08051a; --panel:#140e33; --accent:#67e8f9; --accent2:#a78bfa;
  --text:#f1ecff; --muted:#a79bd6; --danger:#f87171; --warn:#fbbf24;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; color:var(--text);
  background:
    radial-gradient(ellipse 85% 45% at 50% 0%, rgba(124,58,237,.38), transparent 72%),
    radial-gradient(ellipse 70% 40% at 50% 100%, rgba(34,211,238,.11), transparent 72%),
    linear-gradient(180deg,#0b0624,var(--bg));
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
header{
  padding:16px 20px calc(10px + env(safe-area-inset-top,0px));
  text-align:center; border-bottom:1px solid rgba(139,92,246,.32);
}
header h1{margin:0 0 4px; font-size:1.4rem; text-shadow:0 2px 12px rgba(110,231,183,.35);}
header p{margin:0; color:var(--muted); font-size:.85rem;}
#menu{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:8px; padding:14px; max-width:1100px; margin:0 auto;
}
/* 8 games a day lay out evenly: 2 columns on phones, 4x2 on tablets, one row of 8 on desktop. */
@media (min-width:600px){ #menu{ grid-template-columns:repeat(4,1fr); } }
@media (min-width:1000px){ #menu{ grid-template-columns:repeat(8,1fr); } }
#menu button{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  min-height:92px; padding:14px 8px; color:#fff; font-size:.82rem; font-weight:700; line-height:1.2; cursor:pointer;
  background:linear-gradient(180deg,#8b5cf6,#5b21b6); border:1px solid rgba(255,255,255,.22); border-radius:12px;
  box-shadow:0 3px 10px rgba(91,33,182,.45), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .12s, box-shadow .15s, background .15s, border-color .15s;
}
#menu button .ic{ font-size:1.75rem; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
@media (hover:hover){
#menu button:hover, #menu button:focus-visible{
  background:linear-gradient(180deg,#22d3ee,#0e7490); border-color:#a5f3fc; transform:translateY(-3px); outline:none;
  box-shadow:0 0 18px rgba(34,211,238,.55), 0 8px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
}
#menu button:active{ transform:translateY(0) scale(.97); }
#menu .dayTag{ position:absolute; top:5px; right:6px; font-size:.6rem; font-weight:800; letter-spacing:.04em; padding:1px 5px; border-radius:6px; background:rgba(0,0,0,.4); color:#e9d5ff; }
#adminBar{ max-width:1100px; margin:8px auto 0; padding:0 14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.72rem; color:#c4b5fd; }
#adminBar[hidden]{ display:none; }
#adminBar b{ letter-spacing:.12em; margin-right:4px; }
#adminBar button{ border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; border-radius:8px; padding:4px 9px; font-size:.72rem; cursor:pointer; }
#adminBar button.on{ background:#7c3aed; border-color:#c4b5fd; }
#headerLogo{ display:block; margin:0 auto 4px; width:min(72vw,300px); height:auto; filter:drop-shadow(0 0 14px rgba(168,85,247,.55)); transition:width .2s ease; }
header.compact{ padding-top:8px; padding-bottom:8px; }
header.compact #headerLogo{ width:92px; margin-bottom:0; }
header.compact p{ display:none; }
#toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:2500; background:rgba(20,16,40,.95); color:#e9d5ff; border:1px solid #7c3aed; padding:8px 14px; border-radius:10px; font-size:.8rem; opacity:0; pointer-events:none; transition:opacity .3s; }
#toast.show{ opacity:1; }
#promo{ max-width:720px; margin:12px auto 0; padding:12px 18px; text-align:center; border-radius:14px; border:1px solid transparent; background:linear-gradient(rgba(24,14,66,.92),rgba(24,14,66,.92)) padding-box, linear-gradient(90deg,#a855f7,#22d3ee,#e879f9) border-box; box-shadow:0 0 22px rgba(139,92,246,.35), 0 0 36px rgba(34,211,238,.18); }
#promo[hidden]{ display:none; }
#promo .promoTitle{ font-weight:900; letter-spacing:.16em; text-transform:uppercase; font-size:.8rem; color:#f0abfc; text-shadow:0 0 10px rgba(232,121,249,.6); }
#promo .promoText{ margin-top:4px; font-size:.92rem; color:#e9e5ff; }
#promo .promoText b{ color:#67e8f9; }
#wrap{max-width:1100px; margin:0 auto; padding:0 14px 30px;}
#stage{
  background:none; border:none; box-shadow:none; border-radius:0;
  min-height:0; padding:4px 0 30px; display:flex; flex-direction:column;
  align-items:center; gap:10px; overflow-x:auto;
}
#stage h2{margin:0; font-size:1.1rem; letter-spacing:.3px;}
#stage .info{color:var(--muted); font-size:.8rem; text-align:center;}
canvas{background:radial-gradient(ellipse at center,#211457 0%,#08051c 100%); border-radius:10px; box-shadow:0 8px 22px rgba(0,0,0,.45), 0 0 0 1px rgba(167,139,250,.38), 0 0 26px rgba(124,58,237,.22); max-width:100%; height:auto; touch-action:none;}
.score{font-weight:700; color:var(--accent); text-shadow:0 0 12px rgba(34,211,238,.35); letter-spacing:.2px;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.gbtn{
  background:linear-gradient(180deg,#8b5cf6,#5b21b6); color:#fff; border:1px solid rgba(255,255,255,.22); border-radius:9px;
  padding:8px 16px; font-weight:700; cursor:pointer; font-size:.85rem;
  box-shadow:0 3px 0 rgba(0,0,0,.3), 0 4px 12px rgba(124,58,237,.4), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .08s, box-shadow .15s, background .15s;
}
.gbtn.secondary{ background:linear-gradient(180deg,#34296f,#251c56); color:var(--text); border-color:rgba(167,139,250,.3); box-shadow:0 3px 0 rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25); }
@media (hover:hover){ .gbtn:hover:not(:disabled){ background:linear-gradient(180deg,#22d3ee,#0e7490); border-color:#a5f3fc; box-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 18px rgba(34,211,238,.55); } }
@media (hover:hover){ .gbtn.secondary:hover:not(:disabled){ background:linear-gradient(180deg,#4b3a9a,#33287a); border-color:#c4b5fd; box-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 14px rgba(167,139,250,.45); } }
.gbtn:disabled{ opacity:.5; cursor:default; }
.gbtn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25);}
.grid{display:grid; gap:7px;}
.cell{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#2b2160,#1b1445); border:1px solid rgba(167,139,250,.28); border-radius:9px;
  box-shadow:0 2px 5px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.02) inset;
  cursor:pointer; user-select:none; font-weight:700;
  transition:transform .12s, box-shadow .15s, background .3s ease, color .3s ease;
}
@keyframes popCell{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
.pop{ animation:popCell .32s ease; }
@keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
.fade-in{ animation:fadeSlideIn .25s ease; }
@keyframes shakeCell{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
.shake{ animation:shakeCell .22s ease; }
@media (hover:hover){ .cell:hover{background:linear-gradient(180deg,#3a2c78,#271c58); border-color:rgba(103,232,249,.6); box-shadow:0 4px 12px rgba(0,0,0,.4), 0 0 12px rgba(34,211,238,.25);} }
.cell:active{transform:scale(.95);}
input[type=text]{
  font-size:16px; max-width:100%; box-sizing:border-box;
  background:rgba(20,12,56,.8); border:1px solid rgba(167,139,250,.45); color:var(--text);
  padding:8px 10px; border-radius:8px; width:220px; text-align:center; outline:none;
}
input[type=text]:focus{ border-color:#22d3ee; box-shadow:0 0 0 3px rgba(34,211,238,.22); }
input[type=text]::placeholder{ color:#8478b8; }
.hidden{display:none;}
.lvbox{ display:flex; flex-direction:column; align-items:center; gap:5px; margin:2px 0 6px; }
.lvstrip{ display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap; }
.lvlabel{ font-size:.62rem; letter-spacing:.2em; color:var(--muted); font-weight:800; margin-right:4px; }
.lvchip{ display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:28px; padding:0 6px; border-radius:8px; border:1px solid rgba(167,139,250,.35); background:rgba(37,28,86,.85); color:#fff; font-size:.78rem; font-weight:800; cursor:pointer; transition:transform .1s, border-color .15s, box-shadow .15s; }
@media (hover:hover){ .lvchip:hover:not(:disabled){ border-color:#22d3ee; transform:translateY(-1px); } }
.lvchip.done{ border-color:#22d3ee; color:#a5f3fc; }
.lvchip.cur{ background:linear-gradient(180deg,#8b5cf6,#5b21b6); border-color:#e9d5ff; color:#fff; box-shadow:0 0 12px rgba(139,92,246,.75); }
.lvchip.locked{ opacity:.4; cursor:not-allowed; font-size:.7rem; }
.lvchip.ro{ cursor:default; pointer-events:none; }
.lvgoal{ font-size:.82rem; color:#c4b5fd; text-align:center; max-width:520px; }
.lvgoal.ok{ color:#67e8f9; font-weight:800; }
.lvnext{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }

@keyframes fall{ to{ transform:translateY(115vh) rotate(360deg); opacity:.9; } }
@keyframes popIn{ from{ transform:translate(-50%,-50%) scale(.5); opacity:0; } to{ transform:translate(-50%,-50%) scale(1); opacity:1; } }
.best{color:var(--warn); font-size:.85rem;}
@keyframes molePop{ 0%{ transform:scale(1); } 30%{ transform:scale(1.4) rotate(-8deg); } 100%{ transform:scale(0) rotate(12deg); opacity:0; } }
@keyframes floatUp{ 0%{ transform:translate(-50%,0); opacity:1; } 100%{ transform:translate(-50%,-40px); opacity:0; } }
.mole-hit{ animation:molePop .35s ease forwards; }
.hit-popup{ position:absolute; top:-4px; left:50%; font-weight:800; color:var(--accent); font-size:1rem; pointer-events:none; animation:floatUp .6s ease forwards; }

/* ---------- SPLASH SCREEN ---------- */
#splash{
  position:fixed; inset:0; z-index:3000; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(16px,3.2vh,30px);
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(ellipse 70% 45% at 50% 38%, rgba(124,58,237,.38), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(217,70,239,.28), transparent 70%),
    linear-gradient(180deg,#05030f 0%,#0a0620 55%,#150a35 100%);
  transition:opacity .6s ease, transform .6s ease;
}
#splash.leaving{ opacity:0; transform:scale(1.06); pointer-events:none; }
#splash .stars span{ position:absolute; border-radius:50%; opacity:.2; animation:twinkle 3s ease-in-out infinite; box-shadow:0 0 6px currentColor; }
@keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.4);} }
#splash .floor{
  position:absolute; left:-50%; right:-50%; bottom:-6%; height:62%;
  background:
    linear-gradient(to right, rgba(217,70,239,.85) 1px, transparent 1px) 0 0/64px 64px,
    linear-gradient(to bottom, rgba(34,211,238,.85) 1px, transparent 1px) 0 0/64px 64px;
  transform:perspective(420px) rotateX(58deg); transform-origin:center bottom;
  -webkit-mask-image:linear-gradient(to top,#000 15%,transparent 92%); mask-image:linear-gradient(to top,#000 15%,transparent 92%);
  animation:floorScroll 2.6s linear infinite; pointer-events:none;
}
@keyframes floorScroll{ to{ background-position:0 0, 0 64px; } }
#splash .logo{
  position:relative; z-index:1; width:min(90vw,700px); height:auto;
  filter:drop-shadow(0 0 22px rgba(168,85,247,.65)) drop-shadow(0 0 48px rgba(34,211,238,.3));
  animation:logoFloat 4.5s ease-in-out infinite;
}
@keyframes logoFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
#splash .tag{
  position:relative; z-index:1; margin:0; text-align:center; font-weight:800; letter-spacing:.32em; text-transform:uppercase;
  font-size:clamp(.7rem,2.2vw,.95rem); color:#c4b5fd; text-shadow:0 0 12px rgba(168,85,247,.8);
}
#playBtn{
  position:relative; z-index:1; cursor:pointer; color:#fff; border-radius:14px; border:3px solid #22d3ee;
  padding:clamp(14px,2.4vh,20px) clamp(34px,8vw,64px);
  font:900 clamp(1.25rem,4.6vw,1.9rem)/1 "Arial Black",Impact,system-ui,sans-serif; letter-spacing:.2em; text-transform:uppercase;
  text-shadow:0 0 10px rgba(255,255,255,.85), 0 2px 0 rgba(0,0,0,.35);
  background:linear-gradient(180deg,#22d3ee,#0e7490);
  box-shadow:0 0 18px 3px rgba(34,211,238,.8), 0 0 46px 8px rgba(34,211,238,.4), inset 0 0 14px rgba(255,255,255,.35);
  animation:strobe 1s steps(1,end) infinite;
}
#playBtn:hover{ transform:scale(1.05); }
#playBtn:active{ transform:scale(.97); }
#playBtn:focus-visible{ outline:3px solid #fff; outline-offset:5px; }
/* Hard alternation between the logo's cyan and magenta, 2 flips/second (under the 3Hz flash guideline). */
@keyframes strobe{
  0%,49.99%{ border-color:#67e8f9; background:linear-gradient(180deg,#22d3ee,#0e7490);
    box-shadow:0 0 18px 3px rgba(34,211,238,.85), 0 0 46px 8px rgba(34,211,238,.45), inset 0 0 14px rgba(255,255,255,.35); }
  50%,100%{ border-color:#f0abfc; background:linear-gradient(180deg,#e879f9,#7e22ce);
    box-shadow:0 0 18px 3px rgba(232,121,249,.85), 0 0 46px 8px rgba(217,70,239,.45), inset 0 0 14px rgba(255,255,255,.35); }
}
#splash .hint{ position:relative; z-index:1; margin:0; font-size:.75rem; letter-spacing:.25em; color:#8b7fc7; text-transform:uppercase; text-align:center; }
@media (prefers-reduced-motion:reduce){
  #playBtn{ animation:softPulse 2.6s ease-in-out infinite; }
  #splash .floor, #splash .logo, #splash .stars span{ animation:none; }
  @keyframes softPulse{ 0%,100%{ box-shadow:0 0 14px 2px rgba(34,211,238,.6);} 50%{ box-shadow:0 0 30px 8px rgba(232,121,249,.7);} }
}

/* ---------- MOBILE ---------- */
html{ -webkit-text-size-adjust:100%; }
body{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
#stage{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
#stage input{ -webkit-user-select:text; user-select:text; }
#touchpad{ display:none; position:fixed; left:0; right:0; bottom:0; z-index:1500; justify-content:space-between; align-items:flex-end;
  padding:0 14px calc(14px + env(safe-area-inset-bottom,0px)); pointer-events:none; }
body.has-pad #touchpad{ display:flex; }
body.has-pad #stage{ padding-bottom:210px; }
#touchpad .cluster{ display:grid; gap:8px; }
.tpad{ pointer-events:auto; width:58px; height:58px; border-radius:16px; border:1px solid rgba(196,181,253,.5); background:rgba(46,34,102,.8);
  color:#fff; font-size:1.5rem; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; box-shadow:0 4px 12px rgba(0,0,0,.45); }
.tpad.on{ background:linear-gradient(180deg,#22d3ee,#0e7490); border-color:#a5f3fc; }
.tpad.wide{ width:88px; }
.tpad.act{ width:72px; height:72px; border-radius:50%; font-size:1.35rem; }
.tpad.empty{ visibility:hidden; pointer-events:none; }
body.swipe-game #stage canvas, body.swipe-game #stage .grid{ touch-action:none; }
@media (max-width:480px){
  #wrap{ padding-left:10px; padding-right:10px; }
  #menu{ gap:7px; padding:10px; }
  .lvchip{ min-width:26px; padding:0 4px; }
  #promo{ margin:10px 10px 0; padding:10px 12px; }
}
</style>
</head>
<body>
<header id="appHeader">
  <img id="headerLogo" alt="Arc8">
  <p id="headerSub"></p>
</header>
<div id="adminBar" hidden></div>
<div id="promo" hidden></div>
<div id="menu"></div>
<div id="toast"></div>
<div id="touchpad" aria-label="Game controls"></div>
<div id="wrap"><div id="stage"><p class="info">Choose a game above to start playing.</p></div></div>


<div id="splash" role="dialog" aria-label="Welcome to Arc8">

<script>
const stage = document.getElementById('stage');
const menu = document.getElementById('menu');
const appHeader = document.getElementById('appHeader');
{ const sl=document.querySelector('#splash .logo'); if(sl) document.getElementById('headerLogo').src=sl.src; }
let gameVersion = 0;
window.onkeydown = null;

function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; }
function makeCanvas(w,h,container){ const c=document.createElement('canvas'); c.width=w; c.height=h; (container||stage).appendChild(c); return c; }
function title(t,container){ const h=document.createElement('h2'); h.textContent=t; (container||stage).appendChild(h); }
function info(t,container){ const p=document.createElement('p'); p.className='info'; p.textContent=t; (container||stage).appendChild(p); }
function scoreEl(txt,container){ const s=document.createElement('div'); s.className='score'; s.textContent=txt; (container||stage).appendChild(s); return s; }
function btn(txt, cls, onClick){ const b=document.createElement('button'); b.className='gbtn '+(cls||''); b.textContent=txt; b.onclick=onClick; return b; }
function roundRect(ctx,x,y,w,h,r){
  if(w<2*r) r=w/2; if(h<2*r) r=h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillRound(ctx,x,y,w,h,r,style){ roundRect(ctx,x,y,w,h,r); ctx.fillStyle=style; ctx.fill(); }
function withGlow(ctx,color,blur,drawFn){ ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=blur; drawFn(); ctx.restore(); }
function lgrad(ctx,x0,y0,x1,y1,c1,c2){ const g=ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,c1); g.addColorStop(1,c2); return g; }
function rgrad(ctx,x,y,r,c1,c2){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,c1); g.addColorStop(1,c2); return g; }
// Restarts the .pop CSS animation on an element — use whenever a cell's state changes
// so the player's eye is drawn to exactly what just happened.
function pop(el){ if(!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

let audioCtx;
function beep(freq=440, dur=150, type='sine', vol=0.15){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur/1000);
    o.stop(audioCtx.currentTime+dur/1000);
  }catch(e){}
}
function celebrate(msg){
  beep(660,120); setTimeout(()=>beep(880,180),130);
  const layer=document.createElement('div');
  layer.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;';
  document.body.appendChild(layer);
  const emojis=['🎉','✨','⭐','🎊','🏆'];
  for(let i=0;i<24;i++){
    const p=document.createElement('div');
    p.textContent=emojis[rand(0,emojis.length-1)];
    p.style.cssText=`position:absolute;left:${rand(0,100)}%;top:-30px;font-size:${rand(16,28)}px;animation:fall ${rand(1200,2200)}ms ease-in forwards;animation-delay:${rand(0,300)}ms;`;
    layer.appendChild(p);
  }
  if(msg){
    const banner=document.createElement('div');
    banner.textContent=msg;
    banner.style.cssText='position:fixed;top:20%;left:50%;background:rgba(24,14,66,.95);border:2px solid #22d3ee;color:#a5f3fc;box-shadow:0 0 22px rgba(34,211,238,.45),0 0 40px rgba(124,58,237,.35);padding:14px 26px;border-radius:12px;font-weight:800;font-size:1.15rem;z-index:1000;animation:popIn .3s ease;text-align:center;max-width:80vw;';
    layer.appendChild(banner);
  }
  setTimeout(()=>layer.remove(),2400);
}
function lvKey(id){ const c=Levels.ctx; return (c && c.level>1) ? id+'@L'+c.level : id; }
function getBest(id){ try{ id=lvKey(id); const v=localStorage.getItem('arcade_best_'+id); return v===null?null:Number(v); }catch(e){ return null; } }
function setBest(id,val){ try{ localStorage.setItem('arcade_best_'+lvKey(id),val); }catch(e){} }
function bestLine(container){ const d=document.createElement('div'); d.className='best'; container.appendChild(d); return d; }
// Reports a final score. lowerBetter=true for things like time/tries where smaller wins.
// Returns true if this is a new best (and fires the celebration).
function incrementStat(id, el, label){
  const cur=(getBest(id)||0)+1; setBest(id,cur);
  if(el) el.textContent=(label||'Total wins')+': '+cur;
  celebrate('You won! 🏆');
  Levels.onWin();
  return cur;
}
function reportScore(id, value, lowerBetter, el, label){
  const cur=getBest(id);
  const isNew = cur===null || (lowerBetter? value<cur : value>cur);
  if(isNew) setBest(id,value);
  const best=getBest(id);
  if(el) el.textContent = (label||'Best')+': '+best + (isNew?' — New best! 🏆':'');
  if(isNew) celebrate('New high score! 🏆');
  Levels.onScore(value,lowerBetter);
  return isNew;
}
// Renders Easy/Medium/Hard buttons above a fresh body container.
// onSelect(diff, body, token) builds the actual game into `body`.
// token.alive turns false the moment another difficulty is chosen, so old loops/timers can bail out.
// ---------- LEVELS ----------
// Every game has 10 levels per difficulty tier. Level 1 is exactly the game as it always was;
// each level after that nudges the tier's parameters further along its easy→hard direction
// (saturating, so values stay sane) and sets a goal to clear. Clear a level to unlock the next.
// Progress is saved per game + tier; high scores are kept per level (level 1 keeps the old keys).
const MAX_LEVEL=10, TIERS=['easy','medium','hard'];
// Bounds applied after scaling, so nothing becomes invalid (e.g. more pairs than icons). '_' = scalar tables.
const LEVEL_CLAMPS={
  shooter:{time:[10,60],rMin:[6,60],rMax:[10,80],life:[1.1,10]}, memory:{pairs:[6,10],cols:[4,5]}, snake:{_:[50,300]},
  whack:{time:[10,40],pMin:[150,2000],pMax:[400,3000]}, reaction:{minWait:[300,5000],maxWait:[1500,8000],size:[170,400]},
  simon:{_:[300,1500]}, '2048':{_:[3,5]}, flappy:{gap:[70,200],speed:[1.5,4.5]}, breakout:{paddle:[40,200],speed:[2,5.4],rows:[3,6]},
  stroop:{_:[8,60]}, mathrace:{min:[1,40],max:[10,80],time:[18,60]}, dodge:{spawnChance:[.02,.085],baseSpeed:[2,4.6],accel:[.03,.1]},
  mines:{size:[8,18],mineCount:[10,70],cell:[26,44]}, pong:{lerp:[.04,.3],error:[.3,5],speed:[2.6,5.5],accel:[1,1.045]},
  guess:{_:[50,1000]}, slide:{_:[3,6]}, hangman:{tries:[3,10]}, invaders:{rows:[3,6],cols:[6,9],speed:[.3,1.6]}, maze:{_:[9,19]},
  tower:{speed:[2,6],tolerance:[3,18]}, blackjack:{_:[15,21]}, echo:{interval:[3500,12000],speed:[2.2,3.8]},
  mirror:{n:[7,12],density:[.15,.3],ms:[150,400]}, gravgolf:{wells:[1,5],holeR:[8,20],hazards:[0,6]}, pulsegrid:{n:[3,6],scramble:[3,14]},
  tempo:{zoneW:[22,90],speedStart:[1,2.6],shrink:[.86,.97]}, shade:{n:[3,6],previewMs:[3000,7000]},
  split:{leftMs:[500,2000],rightMs:[600,2200],missLimit:[2,9]}, battleship:{n:[6,12]}, lanehop:{lanes:[4,10],speed:[1.2,3.8]},
  dicegame:{rerolls:[1,3]}, gemswap:{n:[5,8],colors:[4,6],moves:[10,22]}, blockdrop:{cols:[6,10],rows:[14,20],tick:[200,700]},
  bowling:{aimSpeed:[2,6],powerSpeed:[2,6],spreadMult:[.5,1.5]}
};
// How to clear a level. {win:'…'} = any win. {hi:true,f} = reach f(level,tier,params) (higher is better);
// {lo:true,f} = get at-or-below it. 'scale' converts the value a game reports (e.g. ms → seconds).
const LEVEL_GOALS={
  shooter:{hi:1,unit:'points',f:L=>8+2*(L-1)}, memory:{win:'Match every pair'}, ttt:{win:'Beat the computer (a draw counts against a near-perfect AI)'},
  snake:{hi:1,unit:'apples',f:L=>3+2*(L-1)}, whack:{hi:1,unit:'moles',f:L=>6+Math.round(1.5*(L-1))},
  reaction:{lo:1,unit:'ms',lowWord:'or faster',f:L=>600-30*(L-1)}, rps:{hi:1,unit:'wins in a row',f:L=>2+Math.floor(L/3)},

const Levels={
  ctx:null, desired:{}, baseTables:new WeakMap(),
  level(){ return this.ctx?this.ctx.level:1; },
  prog(game,tier){ try{ return +localStorage.getItem('arc8_prog_'+game+'_'+tier)||0; }catch(e){ return 0; } },
  setProg(game,tier,L){ try{ localStorage.setItem('arc8_prog_'+game+'_'+tier,String(L)); }catch(e){} },
  unlocked(game,tier){ return adminMode?MAX_LEVEL:Math.min(MAX_LEVEL,this.prog(game,tier)+1); },
  // Rewrite tables[tier] in place for this level (always from a pristine copy, so it never compounds).
  scale(tables,tier,level,game){
    if(!tables) return;
    if(!this.baseTables.has(tables)) this.baseTables.set(tables,JSON.parse(JSON.stringify(tables)));
    const base=this.baseTables.get(tables), t=base[tier];
    if(t===undefined) return;
    const e=base.easy, hd=base.hard, clamps=LEVEL_CLAMPS[game]||{};
    const f=0.5*(1-Math.pow(0.85,level-1));                       // fraction of the easy→hard span to add (saturating)
    const idx=TIERS.indexOf(tier)<0?1:TIERS.indexOf(tier);
    const tgt=base[TIERS[Math.min(2,idx+(level>=8?2:level>=4?1:0))]];   // word lists / ship sets graduate to the next tier
    const one=(bv,ev,hv,gv,key)=>{
      if(typeof bv==='number'&&typeof ev==='number'&&typeof hv==='number'){
        let v=bv+(hv-ev)*f;
        v=(Number.isInteger(bv)&&Number.isInteger(ev)&&Number.isInteger(hv))?Math.round(v):Math.round(v*10000)/10000;
        const cl=clamps[key]; if(cl) v=Math.min(Math.max(v,cl[0]),cl[1]);
        return v;
      }
      if(Array.isArray(bv)){
        if(bv.every(x=>typeof x==='string')) return Array.isArray(gv)?[...new Set([...bv,...gv])]:bv;
        return Array.isArray(gv)?gv:bv;
      }
      return gv!==undefined?gv:bv;
    };
    if(Array.isArray(t)||typeof t==='number') tables[tier]=one(t,e,hd,tgt,'_');
    else if(t&&typeof t==='object'){
      const out={}; for(const k of Object.keys(t)) out[k]=one(t[k],e?e[k]:t[k],hd?hd[k]:t[k],tgt?tgt[k]:t[k],k);
      tables[tier]=out;
    }
  },
  goalFor(game,tier,L,P){
    let g=LEVEL_GOALS[game]; if(typeof g==='function') g=g(tier);
    if(!g||g.win) return {win:(g&&g.win)||'Clear the level'};
    return {hi:!!g.hi,lo:!!g.lo,target:Math.round(g.f(L,tier,P)),unit:g.unit,lowWord:g.lowWord||'or fewer',scale:g.scale||1};
  },
  goalText(g){
    if(g.win) return '🎯 Goal: '+g.win;
    return g.hi?`🎯 Goal: reach ${g.target} ${g.unit}`:`🎯 Goal: ${g.target} ${g.unit} ${g.lowWord}`;
  },
  // Called by each picker whenever (re)building a game: scales its table, sets the goal, draws the strip.
  begin(game,tier,tables,rebuild,container){
    const key=game+':'+tier;
    // Players can't pick a level: you always play your next uncleared one. (Only the hidden admin view can jump around to test.)
    const front=Math.min(MAX_LEVEL,this.prog(game,tier)+1);
    const L=adminMode?Math.max(1,Math.min(this.desired[key]||front,MAX_LEVEL)):front; this.desired[key]=L;
    window.__needScroll=true;
    this.scale(tables,tier,L,game);
    const P=tables?tables[tier]:null;
    this.ctx={game,tier,level:L,P,key,passed:false,goal:this.goalFor(game,tier,L,P),rebuild,container};
    this.render();
  },
  render(){
    const c=this.ctx; if(!c||!c.container) return;
    const box=c.container; box.className='lvbox'; box.innerHTML='';
    const cleared=this.prog(c.game,c.tier), unl=this.unlocked(c.game,c.tier);
    const strip=document.createElement('div'); strip.className='lvstrip';
    const lab=document.createElement('span'); lab.className='lvlabel'; lab.textContent='LEVEL'; strip.appendChild(lab);
    for(let i=1;i<=MAX_LEVEL;i++){
      const pick=adminMode;   // chips are a read-only progress ladder for players; clickable only in the admin view
      const b=document.createElement(pick?'button':'span');
      b.className='lvchip'+(i===c.level?' cur':'')+(i<=cleared?' done':'')+(i>unl?' locked':'')+(pick?'':' ro');
      b.textContent=i>unl?'🔒':String(i);
      if(pick&&i<=unl) b.onclick=()=>{ this.desired[c.key]=i; c.rebuild(); };
      strip.appendChild(b);
    }
    box.appendChild(strip);
    const goal=document.createElement('div'); goal.className='lvgoal'; box.appendChild(goal);
    if(c.passed){
      goal.classList.add('ok');
      if(c.level<MAX_LEVEL){
        goal.textContent='✔ Level '+c.level+' cleared!';
        const nx=document.createElement('div'); nx.className='lvnext';
        nx.appendChild(btn('Next Level ▶','',()=>{ this.desired[c.key]=c.level+1; c.rebuild(); }));
        box.appendChild(nx);
      } else goal.textContent='🏆 Level 10 cleared — every level done on this difficulty!';
    } else goal.textContent=this.goalText(c.goal);
  },
  pass(){
    const c=this.ctx; if(!c||c.passed) return;
    c.passed=true;
    if(c.level>this.prog(c.game,c.tier)) this.setProg(c.game,c.tier,c.level);
    celebrate('Level '+c.level+' cleared!');
    this.render();
  },
  onScore(v,lower){
    const c=this.ctx; if(!c||c.passed) return;
    const g=c.goal;
    if(g.win) return this.pass();
    if(g.hi && v>=g.target*g.scale) this.pass();
    else if(g.lo && v<=g.target*g.scale) this.pass();
  },
  onWin(){ const c=this.ctx; if(c&&!c.passed&&c.goal.win) this.pass(); }
};

// ---------- DAILY ROTATION ----------
// WEEKDAYS: the 40 games are split into 5 fixed groups of 8 (game i belongs to group i % 5, which
// spreads the genres evenly). Monday shows group 1 … Friday shows group 5, so each game appears
// once per week. WEEKENDS: Saturday opens the first half of the whole list (20 games) and Sunday
// opens the second half (the other 20). The "day" is the player's local calendar day.
const GAMES_PER_DAY = 8;
const ROTATION_DAYS = Math.ceil(GAMES.length / GAMES_PER_DAY);
function dayNumber(){ const n=new Date(); return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/86400000); }
const HALF = Math.ceil(GAMES.length / 2);
function groupOf(index){ return index % ROTATION_DAYS; }
function dayInfo(){ const wd=new Date().getDay(); return wd===6?{kind:'sat'}:wd===0?{kind:'sun'}:{kind:'week',group:wd-1}; }
function isAvailable(i,info){ return info.kind==='sat'?i<HALF : info.kind==='sun'?i>=HALF : groupOf(i)===info.group; }
function todayLabel(info){ return info.kind==='sat'?'Sat':info.kind==='sun'?'Sun':'D'+(info.group+1); }

// ---------- ADMIN VIEW (hidden) ----------
// Not shown anywhere in the UI. Type ADMIN_CODE on the keyboard (outside a text box) to
// toggle it; the choice is remembered in this browser. It lists every game, tags each with
// the day of the cycle it appears on, and lets you preview any day's lineup.
// NOTE: this is obscurity, not security — anyone who reads the page source can find the code.
const ADMIN_CODE = 'coinslot88';
let adminMode = false;
try{ adminMode = localStorage.getItem('arc8_admin')==='1'; }catch(e){}

  for(let g=0; g<ROTATION_DAYS; g++) views.push([g,'D'+(g+1)]);

const PAD_LAYOUTS={
  dpad:{cols:3,items:[null,['▲','up'],null,['◀','left'],null,['▶','right'],null,['▼','down'],null]},

function sendKey(type,key,code){
  const fn=type==='down'?window.onkeydown:window.onkeyup;

function makePadButton(spec,repeat,hold){
  const b=document.createElement('button'); b.type='button'; b.className='tpad'+(spec.cls?' '+spec.cls:''); b.textContent=spec.label;
  let timer=null, active=false;
  const press=(e)=>{ e.preventDefault(); if(active) return; active=true; b.classList.add('on'); sendKey('down',spec.key,spec.code); if(repeat) timer=setInterval(()=>sendKey('down',spec.key,spec.code),repeat); };
  const release=(e)=>{ if(e) e.preventDefault(); if(!active) return; active=false; b.classList.remove('on'); clearInterval(timer); sendKey('up',spec.key,spec.code); };

  if(Math.max(Math.abs(dx),Math.abs(dy))<28) return;
  const k=Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp');

// Boards with fixed pixel sizes (grids, long word rows) shrink to fit narrow screens instead of scrolling sideways.
function fitWide(){
  const avail=Math.min(stage.clientWidth,window.innerWidth-16);
  stage.querySelectorAll('.grid,[data-fit]').forEach(g=>{
    g.style.transform=''; g.style.marginBottom=''; g.style.width=''; g.style.maxWidth='';
    const natural=Math.max(g.offsetWidth,g.scrollWidth);      // scrollWidth catches grids whose tracks overflow their own box
    if(natural>avail+1){
      const s=Math.max(avail/natural,0.5);
      g.style.width=natural+'px'; g.style.maxWidth='none';
      const pr=g.parentElement.getBoundingClientRect(), r0=g.getBoundingClientRect();
      const tx=(pr.left+pr.width/2-natural*s/2)-r0.left;       // centre the shrunken board in its container
      g.style.transformOrigin='top left'; g.style.transform='translateX('+tx+'px) scale('+s+')';
      g.style.marginBottom=(-(g.offsetHeight*(1-s)))+'px';
    }
  });
}

games.shooter = function(v){
  title('Target Shooter'); info('Click the targets before time runs out. Bullseye (center) scores double!');
  const DIFFS={ easy:{time:40,rMin:26,rMax:38,life:6}, medium:{time:30,rMin:18,rMax:30,life:4}, hard:{time:20,rMin:11,rMax:18,life:2.5} };
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const P=DIFFS[d];
    const c = makeCanvas(480,360,body); const ctx = c.getContext('2d');
    let score=0, timeLeft=P.time, targets=[], done=false;
    const sc = scoreEl(`Score: 0 | Time: ${P.time}`,body);
    const best = bestLine(body); best.textContent='Best ('+d+'): '+(getBest('shooter_'+d)??0);
    function spawn(){ targets.push({x:rand(34,446), y:rand(34,326), r:rand(P.rMin,P.rMax), born:Date.now()}); }
    for(let i=0;i<3;i++) spawn();
    function drawTarget(t){
      const rings=[['#dc2626',1],['#fef2f2',0.75],['#dc2626',0.5],['#fef2f2',0.25]];
      rings.forEach(([col,frac])=>{ ctx.beginPath(); ctx.arc(t.x,t.y,t.r*frac,0,7); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.stroke(); });
      withGlow(ctx,'#6ee7b7',10,()=>{ ctx.beginPath(); ctx.arc(t.x,t.y,t.r*0.12,0,7); ctx.fillStyle='#6ee7b7'; ctx.fill(); });
    }
    c.onclick = (e)=>{
      if(done) return;
      const r=c.getBoundingClientRect(); const mx=(e.clientX-r.left)*c.width/r.width, my=(e.clientY-r.top)*c.height/r.height;
      for(let i=targets.length-1;i>=0;i--){
        const t=targets[i]; const dist=Math.hypot(mx-t.x,my-t.y);
        if(dist<t.r){
          const bullseye = dist<t.r*0.12;
          score += bullseye? 2:1;
          beep(bullseye?880:520,90);
          targets.splice(i,1); spawn();
          sc.textContent=`Score: ${score} | Time: ${timeLeft}`;
          break;
        }
      }
    };
    const timer = setInterval(()=>{
      if(!token.alive){ clearInterval(timer); return; }
      timeLeft--; if(timeLeft<=0){ clearInterval(timer); done=true; reportScore('shooter_'+d,score,false,best,'Best ('+d+')'); }
      sc.textContent=`Score: ${score} | Time: ${Math.max(timeLeft,0)}`;
    },1000);
    function loop(){
      if(v!==gameVersion || !token.alive){ clearInterval(timer); return; }
      ctx.clearRect(0,0,480,360);
      if(done){ ctx.fillStyle='#fff'; ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.fillText('Time up! Score: '+score,240,180); requestAnimationFrame(loop); return; }
      targets.forEach(t=>{
        const age=(Date.now()-t.born)/1000;
        drawTarget(t);
        if(age>P.life){ const i=targets.indexOf(t); if(i>-1){targets.splice(i,1); spawn();} }
      });
      requestAnimationFrame(loop);
    }
    loop();
  });
};

// ---------- 3. TIC TAC TOE ----------
games.ttt = function(v){
  title('Tic Tac Toe'); info('You are X. Computer is O.');
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function checkWinB(bd,p){ return wins.some(w=>w.every(i=>bd[i]===p)); }
  function minimax(bd,player){
    const opp = player==='O' ? 'X':'O';
    if(checkWinB(bd,'O')) return {score:1};
    if(checkWinB(bd,'X')) return {score:-1};
    if(!bd.includes('')) return {score:0};
    const empty=bd.map((x,i)=>x===''?i:null).filter(x=>x!==null);
    let best=null;
    for(const i of empty){
      bd[i]=player;
      const res=minimax(bd,opp);
      bd[i]='';
      const score=res.score;
      if(best===null || (player==='O'? score>best.score : score<best.score)) best={score,move:i};
    }
    return best;
  }
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    let b=Array(9).fill(''); let over=false;
    const grid=document.createElement('div'); grid.className='grid'; grid.style.gridTemplateColumns='repeat(3,80px)';
    body.appendChild(grid);
    const sc = scoreEl('Your move',body);
    const best = bestLine(body); best.textContent='Total wins ('+d+'): '+(getBest('ttt_wins_'+d)??0);
    function render(){ [...grid.children].forEach((cel,i)=>cel.textContent=b[i]); }
    // Chance the computer plays a perfect move. Level 1 of Easy/Medium is exactly the old AI; it improves with level.
    const L0=Levels.level();
    const skill = d==='easy' ? Math.min(0.54,0.06*(L0-1)) : d==='medium' ? Math.min(0.72,0.08*(L0-1)) : Math.min(0.99,0.72+0.03*(L0-1));
    function aiMove(){
      const empty=b.map((x,i)=>x===''?i:null).filter(x=>x!==null);
      let pick;
      if(Math.random()<skill){
        pick = minimax([...b],'O').move;          // a flawless move
      } else if(d==='easy'){
        pick = empty[rand(0,empty.length-1)];
      } else {
        let found=null;
        for(const i of empty){ b[i]='O'; if(checkWinB(b,'O')) found=i; b[i]=''; if(found!==null) break; }
        if(found===null) for(const i of empty){ b[i]='X'; if(checkWinB(b,'X')) found=i; b[i]=''; if(found!==null) break; }
        pick = found!==null? found : (empty.includes(4)? 4 : empty[rand(0,empty.length-1)]);
      }
      b[pick]='O'; render(); pop(grid.children[pick]); checkAfter();
    }
    function checkAfter(){
      if(checkWinB(b,'O')){ over=true; sc.textContent='Computer wins!'; return; }
      if(!b.includes('')){ over=true; sc.textContent="It's a draw!"; if(skill>=0.9) Levels.onWin(); return; }
      sc.textContent='Your move';
    }
    for(let i=0;i<9;i++){
      const cell=document.createElement('div'); cell.className='cell'; cell.style.width='80px'; cell.style.height='80px'; cell.style.fontSize='30px';
      cell.onclick=()=>{
        if(!token.alive || over||b[i]!=='') return;
        b[i]='X'; render(); pop(grid.children[i]);
        if(checkWinB(b,'X')){ over=true; sc.textContent='You win! 🎉'; incrementStat('ttt_wins_'+d,best,'Total wins ('+d+')'); return; }
        if(!b.includes('')){ over=true; sc.textContent="It's a draw!"; if(skill>=0.9) Levels.onWin(); return; }
        sc.textContent="Computer's move";
        setTimeout(()=>{ if(token.alive) aiMove(); },300);
      };
      grid.appendChild(cell);
    }
    render();
  });
};

games.snake = function(v){
  title('Snake'); info('Arrow keys or WASD to move. Eat the dots.');
  const DIFFS={ easy:160, medium:120, hard:80 };
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const tickMs=DIFFS[d];
    const c=makeCanvas(400,400,body); const ctx=c.getContext('2d'); const g=20;
    let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}], dir={x:1,y:0}, food={x:5,y:5}, score=0, dead=false, reported=false, queue=[];
    const sc=scoreEl('Score: 0',body);
    const best=bestLine(body); best.textContent='Best ('+d+'): '+(getBest('snake_'+d)??0);
    window.onkeydown=(e)=>{
      if(v!==gameVersion || !token.alive) return;
      const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},W:{x:0,y:-1},s:{x:0,y:1},S:{x:0,y:1},a:{x:-1,y:0},A:{x:-1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
      const nd=map[e.key];
      if(nd){
        e.preventDefault();
        // Queue turns (max 2) and judge each against the direction the snake will actually be heading when it takes
        // effect. Checking against the live direction let two quick presses reverse the snake into its own neck.
        const ref=queue.length?queue[queue.length-1]:dir;
        if(!(nd.x===ref.x&&nd.y===ref.y) && !(nd.x===-ref.x&&nd.y===-ref.y) && queue.length<2) queue.push(nd);
      }
    };
    function placeFood(){   // only on empty squares, never under the snake
      const free=[]; for(let x=0;x<20;x++) for(let y=0;y<20;y++) if(!snake.some(s=>s.x===x&&s.y===y)) free.push({x,y});
      if(free.length) food=free[rand(0,free.length-1)];
    }
    function tick(){
      if(v!==gameVersion || !token.alive) return;
      if(!dead){
        if(queue.length) dir=queue.shift();
        const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
        const eating = head.x===food.x && head.y===food.y;
        const bodyHit = (eating?snake:snake.slice(0,-1)).some(s=>s.x===head.x&&s.y===head.y);   // the tail square is vacated this tick, so stepping into it is safe
        if(head.x<0||head.x>19||head.y<0||head.y>19||bodyHit){ dead=true; sc.textContent=`Game over! Score: ${score}`; if(!reported){ reported=true; reportScore('snake_'+d,score,false,best,'Best ('+d+')'); } }
        else{
          snake.unshift(head);
          if(head.x===food.x && head.y===food.y){ score++; sc.textContent='Score: '+score; placeFood(); }
          else snake.pop();
        }
      }
      ctx.clearRect(0,0,400,400); // clear (not accumulate black) so the purple board shows through
      withGlow(ctx,'#f87171',12,()=>{ fillRound(ctx,food.x*g+1,food.y*g+1,g-2,g-2,5,rgrad(ctx,food.x*g+g/2,food.y*g+g/2,g/2,'#fca5a5','#dc2626')); });
      snake.forEach((s,i)=>{
        const t=i/Math.max(snake.length-1,1);
        const col = i===0? '#a7f3d0' : lgrad(ctx,s.x*g,s.y*g,s.x*g+g,s.y*g+g,'#6ee7b7',`hsl(160,60%,${38-t*12}%)`);
        fillRound(ctx,s.x*g+1,s.y*g+1,g-2,g-2,i===0?7:5,col);
      });
      setTimeout(tick,tickMs);
    }
    tick();
  });
};

      card.appendChild(iconEl); card.appendChild(labelEl);

      card.onmouseleave=()=>{ card.style.transform='none'; card.style.boxShadow='0 4px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.04)'; };
      card.onclick=()=>{
        if(!token.alive) return;
        const cpu=cpuMove(move); history.push(move);
        let outcome='tie';
        if(move!==cpu) outcome = beats[move]===cpu ? 'win' : 'lose';
        if(outcome==='win'){ w++; streak++; reportScore('rps_streak_'+d,streak,false,best,'Best win streak ('+d+')'); }
        else if(outcome==='lose'){ l++; streak=0; }
        else t++;
        sc.textContent=`Wins: ${w} | Losses: ${l} | Ties: ${t}`;
        const cpuLabel=opts.find(o=>o[2]===cpu)[1];
        result.textContent = `You: ${label} vs CPU: ${cpuLabel} → ${outcome==='win'?'You win!':outcome==='lose'?'You lose!':"It's a tie!"}`;
        result.classList.remove('fade-in'); void result.offsetWidth; result.classList.add('fade-in');
        pop(iconEl);
        if(outcome==='lose'){ result.classList.remove('shake'); void result.offsetWidth; result.classList.add('shake'); }
      };
      row.appendChild(card);
    });
    body.appendChild(row);
  });
};

games.simon = function(v){

  const DIFFS={ easy:900, medium:700, hard:450 };

    body.appendChild(grid);
    const sc=scoreEl('Round: 0',body);
    const best=bestLine(body); best.textContent='Best round ('+d+'): '+(getBest('simon_'+d)??0);

      const cell=document.createElement('div'); cell.style.cssText=`width:100px;height:100px;border-radius:18px;background:${col};opacity:.55;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:opacity .1s, box-shadow .15s;`;
      cell.onclick=()=>{
        if(!accepting || v!==gameVersion || !token.alive) return;

      };

    });
    function flash(cell,i){ cell.style.opacity='1'; cell.style.boxShadow='0 0 24px 6px '+colors[i]+', 0 4px 10px rgba(0,0,0,.3)'; beep(tones[i],220,'triangle',0.55); setTimeout(()=>{ cell.style.opacity='.55'; cell.style.boxShadow='0 4px 10px rgba(0,0,0,.3)'; },250); }
    function nextRound(){
      if(!token.alive) return;
      seq.push(rand(0,3)); playerIdx=0; sc.textContent='Round: '+seq.length; accepting=false;
      let i=0;
      const iv=setInterval(()=>{
        if(v!==gameVersion || !token.alive){ clearInterval(iv); return; }
        flash(cells[seq[i]],seq[i]); i++;
        if(i>=seq.length){ clearInterval(iv); setTimeout(()=>accepting=true,300); }
      },speed);
    }
    nextRound();
  });
};

// ---------- 9. 2048 ----------
games['2048'] = function(v){
  title('2048'); info('Arrow keys or WASD to slide and merge tiles.');
  const DIFFS={ easy:5, medium:4, hard:3 };
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const size=DIFFS[d]; let b=Array.from({length:size},()=>Array(size).fill(0)); let score=0, over=false;
    const cellPx = size===3?90: size===4?70:56;
    const sc=scoreEl('Score: 0',body);
    const best=bestLine(body); best.textContent='Best ('+d+'): '+(getBest('2048_'+d)??0);
    function movesAvailable(bd){
      for(let r=0;r<size;r++) for(let c=0;c<size;c++){
        if(bd[r][c]===0) return true;
        if(c<size-1 && bd[r][c]===bd[r][c+1]) return true;
        if(r<size-1 && bd[r][c]===bd[r+1][c]) return true;
      }
      return false;
    }
    const grid=document.createElement('div'); grid.className='grid'; grid.style.gridTemplateColumns=`repeat(${size},${cellPx}px)`;
    body.appendChild(grid);
    const cells=[];
    for(let i=0;i<size*size;i++){ const cel=document.createElement('div'); cel.className='cell'; cel.style.width=cellPx+'px'; cel.style.height=cellPx+'px'; cel.style.fontSize='18px'; grid.appendChild(cel); cells.push(cel); }
    function addTile(){ const empties=[]; b.forEach((row,r)=>row.forEach((val,c)=>{if(val===0) empties.push([r,c]);})); if(!empties.length) return; const [r,c]=empties[rand(0,empties.length-1)]; b[r][c]=Math.random()<0.9?2:4; }
    const TILE_COLORS={2:'#44347f',4:'#54428f',8:'#f59e0b',16:'#f97316',32:'#ef4444',64:'#dc2626',128:'#eab308',256:'#facc15',512:'#84cc16',1024:'#22c55e',2048:'#06b6d4'};
    function render(){ b.forEach((row,r)=>row.forEach((val,c)=>{ const cel=cells[r*size+c]; cel.textContent=val||''; cel.style.background = val? 'linear-gradient(180deg,'+(TILE_COLORS[val]||'#a855f7')+',#00000030)':'linear-gradient(180deg,#2b2160,#1b1445)'; cel.style.color = val>4? '#fff':'#e5e7eb'; cel.style.textShadow= val? '0 1px 3px rgba(0,0,0,.4)':'none'; })); sc.textContent='Score: '+score; }
    function slide(row){
      let arr=row.filter(x=>x!==0);
      for(let i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1);} }
      while(arr.length<size) arr.push(0);
      return arr;
    }
    function rotate(bd){ const n=bd.length; const res=Array.from({length:n},()=>Array(n).fill(0)); for(let r=0;r<n;r++) for(let c=0;c<n;c++) res[c][n-1-r]=bd[r][c]; return res; }
    function move(dir){
      if(!token.alive) return;
      let bd=b;
      let rotations = dir==='left'?0: dir==='up'?3: dir==='right'?2: 1;
      for(let i=0;i<rotations;i++) bd=rotate(bd);
      bd=bd.map(slide);
      for(let i=0;i<(4-rotations)%4;i++) bd=rotate(bd);
      const before=b.flat();
      b=bd; addTile();
      const after=b.flat();
      render();
      after.forEach((val,i)=>{ if(val!==before[i] && val!==0) pop(cells[i]); });
      if(!movesAvailable(b) && !over){ over=true; reportScore('2048_'+d,score,false,best,'Best ('+d+')'); sc.textContent='Score: '+score+' — Game over!'; }
    }
    window.onkeydown=(e)=>{
      if(v!==gameVersion || !token.alive || over) return;
      const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',A:'left',d:'right',D:'right',w:'up',W:'up',s:'down',S:'down'};
      if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
    };
    addTile(); addTile(); render();
  });
};

games.flappy = function(v){
  title('Flappy Block'); info('Click / tap or press space to flap. Avoid the pipes.');
  const DIFFS={ easy:{gap:150,speed:2}, medium:{gap:120,speed:2.5}, hard:{gap:90,speed:3.3} };
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const P=DIFFS[d];
    const c=makeCanvas(400,400,body); const ctx=c.getContext('2d');
    let by=180, vy=0, pipes=[{x:400,gap:150}], score=0, dead=false, reported=false;
    const sc=scoreEl('Score: 0',body);
    const best=bestLine(body); best.textContent='Best ('+d+'): '+(getBest('flappy_'+d)??0);
    function flap(){ if(!dead) vy=-6.5; else reset(); }
    function reset(){ by=180; vy=0; pipes=[{x:400,gap:150}]; score=0; dead=false; reported=false; sc.textContent='Score: 0'; }
    c.onclick=flap;
    window.onkeydown=(e)=>{ if(v===gameVersion && token.alive && e.code==='Space'){ e.preventDefault(); flap(); } };
    function loop(){
      if(v!==gameVersion || !token.alive) return;
      if(!dead){
        vy+=0.35; by+=vy;
        pipes.forEach(p=>p.x-=P.speed);
        if(pipes[pipes.length-1].x<230) pipes.push({x:420,gap:rand(80,320-P.gap+150)});
        if(pipes[0].x<-40) { pipes.shift(); score++; sc.textContent='Score: '+score; }
        pipes.forEach(p=>{
          if(p.x<70 && p.x>20 && (by<p.gap-P.gap/2 || by>p.gap+P.gap/2)) dead=true;
        });
        if(by>400||by<0) dead=true;
        if(dead && !reported){ reported=true; reportScore('flappy_'+d,score,false,best,'Best ('+d+')'); }
      }
      ctx.clearRect(0,0,400,400);
      ctx.save(); ctx.translate(50,by); ctx.rotate(Math.min(Math.max(vy*0.05,-0.5),0.9));
      fillRound(ctx,-12,-10,24,20,7,rgrad(ctx,0,0,16,'#a7f3d0','#22c55e'));
      ctx.fillStyle='#0b0f19'; ctx.beginPath(); ctx.arc(6,-3,2,0,7); ctx.fill();
      ctx.restore();
      pipes.forEach(p=>{
        const topH=p.gap-P.gap/2, botY=p.gap+P.gap/2;
        fillRound(ctx,p.x,0,30,topH,6,lgrad(ctx,p.x,0,p.x+30,0,'#3b82f6','#1d4ed8'));
        ctx.fillStyle='#60a5fa'; ctx.fillRect(p.x-3,topH-14,36,14);
        fillRound(ctx,p.x,botY,30,400-botY,6,lgrad(ctx,p.x,0,p.x+30,0,'#3b82f6','#1d4ed8'));
        ctx.fillStyle='#60a5fa'; ctx.fillRect(p.x-3,botY,36,14);
      });
      if(dead){ ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.fillText('Dead! Click to retry',200,200); }
      requestAnimationFrame(loop);
    }
    loop();
  });
};

// ---------- 11. BREAKOUT ----------
games.breakout = function(v){
  title('Breakout'); info('Move mouse / touch to slide paddle. Break all bricks. Infinity Mode splits the ball on every paddle bounce. No End replaces the usual win condition with endless escalating levels, like the arcade original — some have bricks that drift side to side.');
  const DIFFS={ easy:{paddle:110,speed:2.6,rows:3}, medium:{paddle:80,speed:3.4,rows:4}, hard:{paddle:56,speed:4.4,rows:5}, noend:{paddle:80,speed:3.0,rows:3} };
  const MODE_LABELS={ easy:'Easy', medium:'Medium', hard:'Hard', noend:'No End' };
  const BALL_R=6, MAX_BALLS=20;
  let infinityMode=false;
  const modeRow=document.createElement('div'); modeRow.className='btnrow'; stage.appendChild(modeRow);
  const infinityBtn=btn('∞ Infinity Mode: Off','secondary',()=>{
    infinityMode=!infinityMode;
    infinityBtn.textContent='∞ Infinity Mode: '+(infinityMode?'On':'Off');
    if(modeBtns[activeMode]) modeBtns[activeMode].click();
  });
  modeRow.appendChild(infinityBtn);

  // Easy / Medium / Hard / No End as one mutually-exclusive row — exactly like the
  // Easy/Medium/Hard picker everywhere else, just with a fourth option tacked on.
  const pickRow=document.createElement('div'); pickRow.className='btnrow'; stage.appendChild(pickRow);
  const lvBox=document.createElement('div'); lvBox.className='lvbox'; stage.appendChild(lvBox);
  const bodyWrap=document.createElement('div'); bodyWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;'; stage.appendChild(bodyWrap);
  const modeBtns={};
  let activeMode = lastDifficulty['breakout'] || 'medium';
  let currentToken={alive:false};
  function selectMode(mode){
    activeMode=mode;
    lastDifficulty['breakout']=mode;
    currentToken.alive=false;
    window.onkeydown=null; window.onkeyup=null;
    const token=currentToken={alive:true};
    Object.entries(modeBtns).forEach(([k,b])=>b.className='gbtn '+(k===mode?'':'secondary'));
    bodyWrap.innerHTML='';
    Levels.begin('breakout', mode, DIFFS, ()=>selectMode(mode), lvBox);
    buildGame(mode, bodyWrap, token);
  }
  ['easy','medium','hard','noend'].forEach(m=>{
    const b=btn(MODE_LABELS[m], m===activeMode?'':'secondary', ()=>selectMode(m));
    modeBtns[m]=b; pickRow.appendChild(b);
  });

  function buildGame(d, body, token){
    const noEndMode = d==='noend';
    const P=DIFFS[d];
    const c=makeCanvas(440,400,body); const ctx=c.getContext('2d');
    let paddleX=190, bricks=[], rowSpeeds=[], level=1, won=false, lost=false, reported=false;
    let balls=[{x:220,y:300,dx:P.speed*0.85,dy:-P.speed*0.85}];
    const modeTag=infinityMode?'_infinity':'';
    const modeLabel=infinityMode?' · Infinity':'';
    const scoreKey='breakout_wins_'+d+modeTag;
    const sc=scoreEl('',body);
    const best=bestLine(body);
    best.textContent = noEndMode
      ? 'Best level reached ('+MODE_LABELS[d]+modeLabel+'): '+(getBest(scoreKey)??0)
      : 'Total clears ('+MODE_LABELS[d]+modeLabel+'): '+(getBest(scoreKey)??0);
    function spawnLevel(lvl){
      bricks=[];
      const rows=Math.min(3+Math.floor((lvl-1)/2),6);
      rowSpeeds=new Array(rows).fill(0);
      const movingChance=Math.min(0.12+lvl*0.05,0.55);
      for(let r=0;r<rows;r++){
        if(noEndMode && Math.random()<movingChance) rowSpeeds[r]=(Math.random()<0.5?-1:1)*(0.6+Math.random()*0.6);
        for(let col=0;col<8;col++) bricks.push({x:col*54+4,y:r*22+30,alive:true,row:r});
      }
    }
    function updateSc(){
      const parts=[];
      if(noEndMode) parts.push('Level: '+level);
      if(infinityMode) parts.push('Balls in play: '+balls.length);
      sc.textContent=parts.join(' | ');
    }
    if(noEndMode) spawnLevel(1);
    else for(let r=0;r<P.rows;r++) for(let col=0;col<8;col++) bricks.push({x:col*54+4,y:r*22+30,alive:true,row:r});
    updateSc();
    c.onmousemove=(e)=>{ const rect=c.getBoundingClientRect(); paddleX=Math.min(Math.max((e.clientX-rect.left)*c.width/rect.width-P.paddle/2,0),440-P.paddle); };
    c.ontouchmove=(e)=>{ const rect=c.getBoundingClientRect(); paddleX=Math.min(Math.max((e.touches[0].clientX-rect.left)*c.width/rect.width-P.paddle/2,0),440-P.paddle); e.preventDefault(); };
    function loop(){
      if(v!==gameVersion || !token.alive) return;
      if(!won && !lost){
        if(noEndMode){
          rowSpeeds.forEach((spd,r)=>{
            if(spd===0) return;
            let minX=Infinity, maxX=-Infinity, any=false;
            bricks.forEach(b=>{ if(b.row===r && b.alive){ b.x+=spd; minX=Math.min(minX,b.x); maxX=Math.max(maxX,b.x+50); any=true; } });
            if(any && (minX<2 || maxX>438)) rowSpeeds[r]*=-1;
          });
        }
        balls.forEach(ball=>{
          ball.x+=ball.dx; ball.y+=ball.dy;
          if(ball.x<6||ball.x>434) ball.dx*=-1;
          if(ball.y<6) ball.dy*=-1;
          // Only test the paddle while the ball is actually falling toward it, and only
          // once per approach — this is what the old false-positive "miss" bug was: the
          // same downward pass could be re-checked on multiple frames after a real bounce.
          if(!ball.bounced && ball.dy>0 && ball.y+BALL_R>=388 && ball.y<400){
            if(ball.x+BALL_R>paddleX && ball.x-BALL_R<paddleX+P.paddle){
              ball.dy=-Math.abs(ball.dy);
              ball.bounced=true;
              ball.justBounced=true;
            }
          }
          if(ball.dy<0) ball.bounced=false;
          bricks.forEach(b=>{ if(b.alive && ball.x>b.x && ball.x<b.x+50 && ball.y>b.y && ball.y<b.y+16){ b.alive=false; ball.dy*=-1; } });
        });
        if(infinityMode){
          const newBalls=[];
          balls.forEach(ball=>{
            if(ball.justBounced){
              ball.justBounced=false;
              if(balls.length+newBalls.length<MAX_BALLS){
                newBalls.push({x:ball.x,y:ball.y,dx:-ball.dx,dy:ball.dy});
                beep(660,70,'sine',0.2);
              }
            }
          });
          if(newBalls.length){ balls=balls.concat(newBalls); updateSc(); }
        } else {
          balls.forEach(ball=>ball.justBounced=false);
        }
        const before=balls.length;
        balls=balls.filter(ball=>ball.y<410);
        if(balls.length!==before) updateSc();
        if(balls.length===0) lost=true;
        if(bricks.every(b=>!b.alive)){
          if(noEndMode){
            level++;
            spawnLevel(level);
            balls.forEach(b=>{ b.dx*=1.03; b.dy*=1.03; });
            beep(700,120,'sine',0.3);
            updateSc();
          } else won=true;
        }
      }
      ctx.clearRect(0,0,440,400);
      const rowColors=['#f87171','#fb923c','#fbbf24','#a3e635','#60a5fa','#c084fc'];
      bricks.forEach(b=>{ if(b.alive){ const col=rowColors[b.row%rowColors.length]; const moving=noEndMode&&rowSpeeds[b.row]!==0; if(moving) withGlow(ctx,col,8,()=>fillRound(ctx,b.x,b.y,50,16,4,col)); else fillRound(ctx,b.x,b.y,50,16,4,col); } });
      fillRound(ctx,paddleX,388,P.paddle,10,5,lgrad(ctx,paddleX,0,paddleX+P.paddle,0,'#93c5fd','#3b82f6'));
      balls.forEach(ball=>{ withGlow(ctx,'#6ee7b7',14,()=>{ ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R,0,7); ctx.fillStyle=rgrad(ctx,ball.x,ball.y,BALL_R,'#d1fae5','#22c55e'); ctx.fill(); }); });
      if(won && !reported){ reported=true; incrementStat(scoreKey,best,'Total clears ('+MODE_LABELS[d]+modeLabel+')'); }
      if(lost && noEndMode && !reported){ reported=true; reportScore(scoreKey,level,false,best,'Best level reached ('+MODE_LABELS[d]+modeLabel+')'); }
      if(won||lost){ ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.fillText(won?'You cleared it! 🎉':(noEndMode?'All balls lost! Reached level '+level:'All balls lost!'),220,200); }
      requestAnimationFrame(loop);
    }
    loop();
  }
  selectMode(activeMode);
};

  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{

    const disp=document.createElement('div'); disp.style.cssText='font-size:1.8rem;letter-spacing:4px;font-weight:800;'; body.appendChild(disp);
    const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Your guess'; body.appendChild(inp);
    const sc=scoreEl('Score: 0',body);
    const best=bestLine(body); best.textContent='Best ('+d+'): '+(getBest('scramble_'+d)??0);
    function scr(w){ let s; do{ s=shuffle(w.split('')).join(''); } while(s===w); return s; }
    function nextWord(){
      if(idx>=words.length){ disp.textContent='All done!'; inp.disabled=true; reportScore('scramble_'+d,score,false,best,'Best ('+d+')'); return; }
      disp.textContent=scr(words[idx]); disp.classList.remove('fade-in'); void disp.offsetWidth; disp.classList.add('fade-in'); inp.value=''; inp.focus();

      if(e.key==='Enter' && token.alive){
        if(inp.value.trim().toUpperCase()===words[idx]){ score++; sc.textContent='Score: '+score; pop(sc); }

games.dodge = function(v){

  const DIFFS={ easy:{spawnChance:0.025,baseSpeed:2.4,accel:0.03}, medium:{spawnChance:0.04,baseSpeed:3,accel:0.05}, hard:{spawnChance:0.06,baseSpeed:3.8,accel:0.08} };
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const P=DIFFS[d];
    const c=makeCanvas(400,400,body); const ctx=c.getContext('2d');
    let px=190, blocks=[], score=0, dead=false, speed=P.baseSpeed, reported=false;
    const sc=scoreEl('Score: 0',body);
    const best=bestLine(body); best.textContent='Best ('+d+'): '+(getBest('dodge_'+d)??0);
    window.onkeydown=(e)=>{
      if(v!==gameVersion || !token.alive) return;
      if(['ArrowLeft','a','A'].includes(e.key)) px=Math.max(px-20,0);
      if(['ArrowRight','d','D'].includes(e.key)) px=Math.min(px+20,360);
    };
    function loop(){
      if(v!==gameVersion || !token.alive) return;
      if(!dead){
        if(Math.random()<P.spawnChance) blocks.push({x:rand(0,370),y:-20,w:30});
        blocks.forEach(b=>b.y+=speed);
        blocks = blocks.filter(b=>{ if(b.y>400){ score++; sc.textContent='Score: '+score; return false;} return true; });
        blocks.forEach(b=>{ if(b.y+20>380 && b.y<400 && b.x<px+40 && b.x+b.w>px) dead=true; });
        speed = P.baseSpeed+score*P.accel;
        if(dead && !reported){ reported=true; reportScore('dodge_'+d,score,false,best,'Best ('+d+')'); }
      }
      ctx.clearRect(0,0,400,400);
      blocks.forEach(b=>{ withGlow(ctx,'#dc2626',10,()=>{ fillRound(ctx,b.x,b.y,b.w,20,5,lgrad(ctx,b.x,b.y,b.x,b.y+20,'#fca5a5','#dc2626')); }); });
      fillRound(ctx,px,380,40,16,6,lgrad(ctx,px,0,px+40,0,'#a7f3d0','#16a34a'));
      if(dead){ ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.fillText('Hit! Score: '+score,200,200); }
      requestAnimationFrame(loop);
    }
    loop();
  });
};

// ---------- 16. CONNECT FOUR ----------
games.c4 = function(v){
  title('Connect Four'); info('You are red. Click a column to drop your piece — watch it fall into place.');
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const cols=7, rows=6, CELL=48, GAP=7, STEP=CELL+GAP;
    let b=Array.from({length:rows},()=>Array(cols).fill(''));
    let over=false, animating=false, myTurn=true;   // myTurn stays false from your click until the computer has finished, so spam-clicking can't stack extra discs
    const grid=document.createElement('div'); grid.className='grid'; grid.style.cssText=`grid-template-columns:repeat(${cols},${CELL}px); position:relative;`;
    body.appendChild(grid);
    const sc=scoreEl('Your turn (Red)',body);
    const best=bestLine(body); best.textContent='Total wins ('+d+'): '+(getBest('c4_wins_'+d)??0);
    const cellEls=[];
    for(let r=0;r<rows;r++) for(let cIdx=0;cIdx<cols;cIdx++){
      const cell=document.createElement('div'); cell.className='cell'; cell.style.width=CELL+'px'; cell.style.height=CELL+'px'; cell.style.borderRadius='50%'; cell.style.fontSize='0';
      cell.onclick=()=>{ if(token.alive) drop(cIdx); };
      grid.appendChild(cell); cellEls.push(cell);
    }
    function discColor(val){ return val==='R'? 'radial-gradient(circle at 35% 30%, #fca5a5, #dc2626 70%)' : 'radial-gradient(circle at 35% 30%, #fde68a, #d97706 70%)'; }
    function render(){ for(let r=0;r<rows;r++) for(let cIdx=0;cIdx<cols;cIdx++){ const cell=cellEls[r*cols+cIdx]; const val=b[r][cIdx];
      cell.style.background = val? discColor(val) : 'linear-gradient(180deg,#2b2160,#1b1445)';
      cell.style.boxShadow = val? '0 3px 6px rgba(0,0,0,.4) inset, 0 2px 4px rgba(0,0,0,.3)' : '';
    } }
    // Animates a disc falling from above the board into its landing cell, THEN commits
    // it to the real board state — this is what makes it obvious which column/row just changed.
    function animateDrop(r, cIdx, player, callback){
      animating=true;
      const disc=document.createElement('div');
      disc.style.cssText=`position:absolute; left:${cIdx*STEP}px; top:${-STEP}px; width:${CELL}px; height:${CELL}px; border-radius:50%; background:${discColor(player)}; box-shadow:0 3px 6px rgba(0,0,0,.4) inset, 0 4px 10px rgba(0,0,0,.4); transition: top .4s cubic-bezier(.5,0,.75,.1);`;
      grid.appendChild(disc);
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ disc.style.top=(r*STEP)+'px'; }); });
      setTimeout(()=>{
        disc.remove();
        b[r][cIdx]=player;
        render();
        pop(cellEls[r*cols+cIdx]);
        beep(player==='R'?420:360,70,'sine',0.2);
        animating=false;
        callback();
      },420);
    }
    function lowestRow(cIdx){ for(let r=rows-1;r>=0;r--) if(b[r][cIdx]==='') return r; return -1; }
    function checkWin(p){
      for(let r=0;r<rows;r++) for(let cIdx=0;cIdx<cols;cIdx++){
        if(b[r][cIdx]!==p) continue;
        const dirs=[[0,1],[1,0],[1,1],[1,-1]];
        for(const [dr,dc] of dirs){
          let cnt=0;
          for(let k=0;k<4;k++){ const rr=r+dr*k, cc=cIdx+dc*k; if(rr>=0&&rr<rows&&cc>=0&&cc<cols&&b[rr][cc]===p) cnt++; }
          if(cnt===4) return true;
        }
      }
      return false;
    }
    function aiPick(){
      const avail=[]; for(let cc=0;cc<cols;cc++) if(lowestRow(cc)>=0) avail.push(cc);
      const L=Levels.level();
      // Fraction of moves that use the strong logic: Easy/Medium start as before and sharpen with level; Hard is always strong.
      const skill = d==='easy'?Math.min(.6,.06*(L-1)) : d==='medium'?Math.min(.8,.08*(L-1)) : 1;
      const mode = Math.random()<skill ? 'hard' : d;
      if(mode==='easy') return avail[rand(0,avail.length-1)];
      for(const cc of avail){ const r=lowestRow(cc); b[r][cc]='Y'; if(checkWin('Y')){ b[r][cc]=''; return cc; } b[r][cc]=''; }
      for(const cc of avail){ const r=lowestRow(cc); b[r][cc]='R'; if(checkWin('R')){ b[r][cc]=''; return cc; } b[r][cc]=''; }
      if(mode==='hard'){
        let pool=avail;
        if(L>=4){   // from level 4 it also avoids moves that hand you an instant win on the square above
          const safe=avail.filter(cc=>{ const r=lowestRow(cc); b[r][cc]='Y'; let ok=true; if(r-1>=0){ b[r-1][cc]='R'; if(checkWin('R')) ok=false; b[r-1][cc]=''; } b[r][cc]=''; return ok; });
          if(safe.length) pool=safe;
        }
        const center=Math.floor(cols/2);
        return [...pool].sort((x,y)=>Math.abs(x-center)-Math.abs(y-center))[0];
      }
      return avail[rand(0,avail.length-1)];
    }
    function drop(cIdx){
      if(over || animating || !myTurn) return;
      const r=lowestRow(cIdx); if(r<0) return;
      myTurn=false;
      animateDrop(r, cIdx, 'R', ()=>{
        if(!token.alive) return;
        if(checkWin('R')){ over=true; sc.textContent='You win! 🎉'; incrementStat('c4_wins_'+d,best,'Total wins ('+d+')'); return; }
        if(b.flat().every(x=>x!=='')){ over=true; sc.textContent="It's a draw!"; return; }
        sc.textContent="Computer's turn";
        setTimeout(()=>{
          if(!token.alive) return;
          const cIdx2=aiPick(); const r2=lowestRow(cIdx2);
          animateDrop(r2, cIdx2, 'Y', ()=>{
            if(!token.alive) return;
            if(checkWin('Y')){ over=true; sc.textContent='Computer wins!'; return; }
            if(b.flat().every(x=>x!=='')){ over=true; sc.textContent="It's a draw!"; return; }
            sc.textContent='Your turn (Red)';
            myTurn=true;
          });
        },350);
      });
    }
    render();
  });
};

games.mines = function(v){
  title('Minesweeper'); info('Click a cell to open it — your first click always clears a big safe area. Flag suspected mines to keep track of them.');
  const DIFFS = { easy:{size:8,mineCount:10,cell:40}, medium:{size:12,mineCount:25,cell:34}, hard:{size:16,mineCount:45,cell:28} };
  let size, mineCount, cellPx;
  let board, mines, revealed, flagged;
  let over=false, firstClick=true, flagMode=false, difficulty='easy';

  const diffRow=document.createElement('div'); diffRow.className='btnrow';
  const diffBtns={};
  ['easy','medium','hard'].forEach(d=>{
    const b=btn(d[0].toUpperCase()+d.slice(1), d===difficulty?'':'secondary', ()=>startGame(d));
    diffBtns[d]=b; diffRow.appendChild(b);
  });
  stage.appendChild(diffRow);
  const lvBox=document.createElement('div'); lvBox.className='lvbox'; stage.appendChild(lvBox);

  const sc=scoreEl('Mines left: 0');
  const best=bestLine(stage);
  const row=document.createElement('div'); row.className='btnrow';
  const flagBtn=btn('🚩 Flag Mode: Off','secondary',()=>{
    flagMode=!flagMode; flagBtn.textContent='🚩 Flag Mode: '+(flagMode?'On':'Off');
  });
  row.appendChild(flagBtn); stage.appendChild(row);

  const gridWrap=document.createElement('div'); gridWrap.style.cssText='max-width:100%;overflow-x:auto;';
  stage.appendChild(gridWrap);
  let grid, cellEls=[];

  function startGame(d){
    difficulty=d;
    Object.entries(diffBtns).forEach(([k,b])=>b.className='gbtn '+(k===d?'':'secondary'));
    Levels.begin('mines', d, DIFFS, ()=>startGame(d), lvBox);
    ({size,mineCount,cell:cellPx}=DIFFS[d]);
    board=Array.from({length:size},()=>Array(size).fill(0));
    mines=new Set(); revealed=Array.from({length:size},()=>Array(size).fill(false));
    flagged=Array.from({length:size},()=>Array(size).fill(false));
    over=false; firstClick=true;
    best.textContent='Total clears ('+d+'): '+(getBest('mines_wins_'+d)??0);
    sc.textContent='Mines left: '+mineCount;
    gridWrap.innerHTML=''; cellEls=[];
    grid=document.createElement('div'); grid.className='grid'; grid.style.gridTemplateColumns=`repeat(${size},${cellPx}px)`;
    gridWrap.appendChild(grid);
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      const cell=document.createElement('div'); cell.className='cell'; cell.style.width=cellPx+'px'; cell.style.height=cellPx+'px'; cell.style.fontSize=Math.round(cellPx*0.35)+'px';
      cell.onclick=()=>{
        if(over) return;
        if(flagMode){
          if(revealed[r][c]) return;
          flagged[r][c]=!flagged[r][c]; cell.textContent=flagged[r][c]?'🚩':''; updateMineCounter();
        } else handleClick(r,c);
      };
      cell.oncontextmenu=(e)=>{
        e.preventDefault(); if(over||revealed[r][c]) return;
        flagged[r][c]=!flagged[r][c]; cell.textContent=flagged[r][c]?'🚩':''; updateMineCounter();
      };
      grid.appendChild(cell); cellEls.push(cell);
    }
  }

  function placeMines(excludeR,excludeC){
    const excluded=new Set();
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const rr=excludeR+dr, cc=excludeC+dc; if(rr>=0&&rr<size&&cc>=0&&cc<size) excluded.add(rr*size+cc); }
    mines=new Set();
    while(mines.size<mineCount){ const m=rand(0,size*size-1); if(!excluded.has(m)) mines.add(m); }
    board=Array.from({length:size},()=>Array(size).fill(0));
    mines.forEach(m=>{ const r=Math.floor(m/size), c=m%size; board[r][c]=-1; });
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      if(board[r][c]===-1) continue;
      let cnt=0; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const rr=r+dr, cc=c+dc; if(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr][cc]===-1) cnt++; }
      board[r][c]=cnt;
    }
  }
  function floodReveal(r,c){
    if(r<0||r>=size||c<0||c>=size||revealed[r][c]||flagged[r][c]||board[r][c]===-1) return;
    revealed[r][c]=true;
    const cell=cellEls[r*size+c];
    const NUM_COLORS=['','#60a5fa','#22c55e','#f87171','#a78bfa','#f59e0b','#06b6d4','#e5e7eb','#94a3b8'];
    cell.style.background='linear-gradient(180deg,#17103a,#110b2d)'; cell.style.boxShadow='inset 0 0 0 1px #ffffff08';
    cell.textContent=board[r][c]||'';
    cell.style.color=NUM_COLORS[board[r][c]]||'#e5e7eb';
    pop(cell);
    if(board[r][c]===0) for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(!(dr===0&&dc===0)) floodReveal(r+dr,c+dc);
  }
  function revealAll(){ for(let r=0;r<size;r++) for(let c=0;c<size;c++){ const cell=cellEls[r*size+c]; if(board[r][c]===-1) cell.textContent='💣'; } }
  function checkWin(){
    let safeLeft=0; for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(board[r][c]!==-1 && !revealed[r][c]) safeLeft++;
    if(safeLeft===0 && !over){ over=true; sc.textContent='You cleared the field! 🎉'; incrementStat('mines_wins_'+difficulty,best,'Total clears ('+difficulty+')'); }
  }
  function updateMineCounter(){
    if(over) return;
    const flagCount=flagged.reduce((s,rowArr)=>s+rowArr.filter(Boolean).length,0);
    sc.textContent='Mines left: '+(mineCount-flagCount);
  }
  function handleClick(r,c){
    if(over || revealed[r][c] || flagged[r][c]) return;
    if(firstClick){ firstClick=false; placeMines(r,c); }
    if(board[r][c]===-1){
      revealed[r][c]=true;
      const cell=cellEls[r*size+c]; cell.textContent='💣'; cell.style.background='#f87171'; cell.classList.add('shake');
      over=true; revealAll(); sc.textContent='Boom! Game over.'; beep(110,350,'sawtooth',0.4); return;
    }
    beep(660,60,'sine',0.15);
    floodReveal(r,c);
    checkWin();
  }
  startGame('easy');
};

games.pong = function(v){
  title('Pong'); info('Move mouse / touch up-down to control your paddle. First to 10 wins.');
  const DIFFS={ easy:{lerp:0.055,error:3,speed:3.0,accel:1.0,predict:false}, medium:{lerp:0.11,error:1.5,speed:3.6,accel:1.015,predict:true}, hard:{lerp:0.20,error:0.5,speed:4.2,accel:1.03,predict:true} };
  diffPicker('medium',(typeof DIFFS!=='undefined'?DIFFS:null),(d,body,token)=>{
    const P=DIFFS[d];
    const c=makeCanvas(440,300,body); const ctx=c.getContext('2d');
    let py=130, ay=130, ball={x:220,y:150,dx:P.speed,dy:2.4}, myScore=0, aiScore=0, over=false;
    c.onmousemove=(e)=>{ const r=c.getBoundingClientRect(); py=Math.min(Math.max((e.clientY-r.top)*c.height/r.height-30,0),240); };
    c.ontouchmove=(e)=>{ const r=c.getBoundingClientRect(); py=Math.min(Math.max((e.touches[0].clientY-r.top)*c.height/r.height-30,0),240); e.preventDefault(); };
    const sc=scoreEl('You: 0 | CPU: 0',body);
    const best=bestLine(body); best.textContent='Best win streak ('+d+'): '+(getBest('pong_streak_'+d)||0);
    function serve(dir){ ball={x:220,y:150,dx:P.speed*dir,dy:(Math.random()<0.5?1:-1)*2.4}; }
    function loop(){
      if(v!==gameVersion || !token.alive || over) return;
      ball.x+=ball.dx; ball.y+=ball.dy;
      if(ball.y<6||ball.y>294) ball.dy*=-1;
      if(ball.x<26 && ball.y>py-4 && ball.y<py+64){
        ball.dx=Math.abs(ball.dx)*P.accel;
        const hit=(ball.y-(py+30))/30; ball.dy=hit*4;
      }
      if(ball.x>414 && ball.y>ay-4 && ball.y<ay+64) ball.dx=-Math.abs(ball.dx)*P.accel;
      if(ball.x<0){ aiScore++; sc.textContent=`You: ${myScore} | CPU: ${aiScore}`; serve(1); }
      if(ball.x>440){ myScore++; sc.textContent=`You: ${myScore} | CPU: ${aiScore}`; serve(-1); }
      const predictedY = (P.predict && ball.dx>0) ? ball.y + ball.dy*((410-ball.x)/Math.max(ball.dx,0.1)) : ball.y;
      const target = Math.min(Math.max(predictedY-30,0),240);
      ay += (target-ay)*P.lerp + (Math.random()-0.5)*P.error;
      ay = Math.min(Math.max(ay,0),240);
      ctx.clearRect(0,0,440,300);
      ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.setLineDash([6,8]); ctx.beginPath(); ctx.moveTo(220,0); ctx.lineTo(220,300); ctx.stroke(); ctx.setLineDash([]);
      withGlow(ctx,'#6ee7b7',10,()=>fillRound(ctx,10,py,10,60,4,lgrad(ctx,10,py,10,py+60,'#a7f3d0','#16a34a')));
      withGlow(ctx,'#60a5fa',10,()=>fillRound(ctx,420,ay,10,60,4,lgrad(ctx,420,ay,420,ay+60,'#93c5fd','#1d4ed8')));
      withGlow(ctx,'#fff',12,()=>{ ctx.beginPath(); ctx.arc(ball.x,ball.y,6,0,7); ctx.fillStyle='#fff'; ctx.fill(); });
      if(myScore>=10 || aiScore>=10){
        over=true;
        const won = myScore>=10;
        ctx.fillStyle='#fff'; ctx.font='22px sans-serif'; ctx.textAlign='center';
        ctx.fillText(won?'You win! 🎉':'CPU wins!',220,150);
        if(won){
          const streak=(getBest('pong_streak_'+d)||0)+1; setBest('pong_streak_'+d,streak);
          best.textContent='Best win streak ('+d+'): '+streak;
          celebrate('You won 10-'+aiScore+'! 🏆');
          Levels.onWin();
        } else {
          setBest('pong_streak_'+d,0); best.textContent='Best win streak ('+d+'): '+(getBest('pong_streak_'+d)||0);
        }
        body.appendChild(btn('Play Again','',()=>load('pong')));
        return;
      }
      requestAnimationFrame(loop);
    }
    loop();
  });
};
